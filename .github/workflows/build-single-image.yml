name: Build one ahi image

# Builds one member of the ahi-dev family (dev, rust, or python) for amd64
# and arm64 on native runners, smoke-tests each, pushes by digest, and joins
# them into one manifest list. rust and python take base_image, the ahi-dev
# manifest built earlier in the same run, by digest.

on:
  workflow_call:
    inputs:
      name:
        description: dev, rust, or python. Selects images/<name>.
        required: true
        type: string
      image:
        description: ghcr.io image name without a tag
        required: true
        type: string
      base_image:
        description: For rust and python, ghcr.io/iancleary/ahi-dev@sha256:... built in this run. Empty for dev.
        required: false
        type: string
        default: ""
      publish:
        description: edge or release
        required: true
        type: string
      image_version:
        description: OCI version label. edge, or YYYY.MM.DD.NN
        required: true
        type: string
      short_sha:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      no_cache:
        required: true
        type: boolean
    outputs:
      digest:
        description: Manifest list digest, including the sha256 prefix
        value: ${{ jobs.merge.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.name }} (${{ matrix.platform }})
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ inputs.image }}
          IMAGE_NAME: ${{ inputs.name }}
          AHI_IMAGES_BASE_IMAGE: ${{ inputs.base_image }}
          NO_CACHE: ${{ inputs.no_cache }}
          AHI_IMAGES_GIT_SHA: ${{ inputs.git_sha }}
          AHI_IMAGES_IMAGE_VERSION: ${{ inputs.image_version }}
        run: bash scripts/build_image.sh

      - name: Smoke test
        if: steps.build.outputs.smoke == 'true'
        env:
          LOCAL_TAG: ${{ steps.build.outputs.local_tag }}
          IMAGE_NAME: ${{ inputs.name }}
        run: bash scripts/smoke_test_image.sh --name "$IMAGE_NAME" "$LOCAL_TAG"

      - name: Push smoked image by digest
        id: push
        if: steps.build.outputs.smoke == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ inputs.image }}
          IMAGE_NAME: ${{ inputs.name }}
          AHI_IMAGES_BASE_IMAGE: ${{ inputs.base_image }}
          AHI_IMAGES_GIT_SHA: ${{ inputs.git_sha }}
          AHI_IMAGES_IMAGE_VERSION: ${{ inputs.image_version }}
        run: bash scripts/push_image_by_digest.sh

      - name: Attest arch image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign arch image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ahi-images-digest_${{ inputs.name }}_${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ inputs.name }} manifest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ahi-images-digest_${{ inputs.name }}_amd64
          path: ${{ runner.temp }}/digests/amd64

      - name: Download arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ahi-images-digest_${{ inputs.name }}_arm64
          path: ${{ runner.temp }}/digests/arm64

      - name: Create manifest list
        id: merge
        env:
          IMAGE: ${{ inputs.image }}
          PUBLISH: ${{ inputs.publish }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          SHORT_SHA: ${{ inputs.short_sha }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: bash scripts/merge_image_manifests.sh

      - name: Attest manifest list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign manifest list
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
